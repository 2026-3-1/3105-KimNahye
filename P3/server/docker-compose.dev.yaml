version: '3.8'

# 로컬 개발용: PostgreSQL + Redis만 실행
# 사용법: docker-compose -f docker-compose.dev.yaml up -d
# NestJS는 별도로 npm run start:dev 로 실행

services:
  postgresql:
    image: postgres:16-alpine
    container_name: solving-meal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: solving_meal
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solving-meal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  postgres_dev_data:
